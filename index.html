<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Hostile Pinch</title></head>
<body><script>
(async()=>{
  const parts=await Promise.all([0,1,2].map(i=>fetch('s'+i+'.txt').then(r=>r.text())));
  document.open(); document.write(parts.join('')); document.close();
})();
</script></body></html>
